@if(!isLoading) {

  @if(form.get('projectTaskId')?.value == 0) {
    <h1 mat-dialog-title>Create Project Task</h1>
  } @else {
    <h1 mat-dialog-title>Edit Project Task</h1>
  }

  <div mat-dialog-content>
    <form (ngSubmit)="confirm()">
      <div class="flex-container">
        <div class="flex-item">
          <app-input
            [label]="'Project Task Name'"
            [value]="form.get('title')?.value"
            (valueChanged)="handleTitleChange($event)">
          </app-input>
        </div>
        <div class="flex-item">
          <app-input
            [label]="'Description'"
            [value]="form.get('description')?.value"
            (valueChanged)="handleDescriptionChange($event)">
          </app-input>
        </div>
        <div class="flex-item">
          <app-select-status
            [value]="form.get('status')?.value"
            (statusChanged)="handleStatusChange($event)">
          </app-select-status>
        </div>
        <div class="flex-item">
          <app-date-picker
            [label]="'Start Date'"
            [initialDate]="form.get('startDate')?.value"
            (dateSelected)="handleStartDateSelection($event)">
          </app-date-picker>
        </div>
        <div class="flex-item">
          <app-date-picker
            [label]="'End Date'"
            [initialDate]="form.get('dueDate')?.value"
            (dateSelected)="handleDueDateSelection($event)">
          </app-date-picker>
        </div>
      </div>
    </form>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="confirm()">Save</button>
  </div>

} @else {
  <mat-spinner></mat-spinner>
}
