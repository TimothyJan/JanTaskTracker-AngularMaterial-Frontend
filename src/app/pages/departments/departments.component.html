<mat-card>

  <mat-grid-list cols="5" rowHeight="3:1">
    <mat-grid-tile colspan="2">
      <mat-card-title>Department List</mat-card-title>
    </mat-grid-tile>
    <mat-grid-tile colspan="1">
      <button mat-raised-button color="primary" (click)="onOpenDepartmentDialog()">
        Add Department
      </button>
    </mat-grid-tile>
    <mat-grid-tile colspan="2"></mat-grid-tile>
  </mat-grid-list>

  <app-department-list></app-department-list>

</mat-card>
