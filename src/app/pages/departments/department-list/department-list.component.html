<mat-card>
  <mat-card-header>
    <mat-card-title>Department List</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-list>

      @if (!isLoading) {
        <mat-list-item>
          <mat-grid-list cols="4">
            <mat-grid-tile colspan="3">
              Department Name
            </mat-grid-tile>
            <mat-grid-tile colspan="1"></mat-grid-tile>
          </mat-grid-list>
        </mat-list-item>

        @for(department of departments; track department.departmentId ) {
          <mat-list-item>
            <mat-grid-list cols="4">
              <mat-grid-tile colspan="3">
                {{ department.departmentName }}
              </mat-grid-tile>
              <mat-grid-tile colspan="1">

                <button matButton [matMenuTriggerFor]="menu">
                  <mat-icon>more_vert</mat-icon>
                </button>

                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="onOpenEditDialog(department.departmentId)">Edit</button>
                  <button mat-menu-item (click)="onDelete(department.departmentId)">Delete</button>
                  <button mat-menu-item>Cancel</button>
                </mat-menu>

              </mat-grid-tile>
            </mat-grid-list>
          </mat-list-item>
          } @empty {
            No Departments found
          }
      } @else {
        <mat-spinner></mat-spinner>
      }

    </mat-list>
  </mat-card-content>
</mat-card>
