<mat-card>
  <mat-card-header>
    <mat-card-title>
      Add New Department
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">

      <app-input
        label="Department Name"
        (valueChanged)="handleDepartmentChange($event)">
      </app-input>

    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSubmit()">Add Department</button>
  </mat-card-actions>
</mat-card>
