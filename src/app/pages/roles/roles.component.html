<mat-card>
  <mat-grid-list cols="5" rowHeight="3:1">
    <mat-grid-tile colspan="2">
      <mat-card-title>Role List</mat-card-title>
    </mat-grid-tile>
    <mat-grid-tile colspan="1">
      <button mat-raised-button color="primary" (click)="onOpenRoleDialog()">
        Add Role
      </button>
    </mat-grid-tile>
    <mat-grid-tile colspan="2"></mat-grid-tile>
  </mat-grid-list>

  <app-role-list></app-role-list>

</mat-card>
