<mat-card>
  <mat-card-header>
    <mat-card-title>Role List</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="sort-controls">
      <mat-button-toggle-group>
        <mat-button-toggle (click)="toggleSort('role')" [checked]="sortBy === 'role'">
          Sort by Role
        </mat-button-toggle>
        <mat-button-toggle (click)="toggleSort('department')" [checked]="sortBy === 'department'">
          Sort by Department
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <mat-list>
      <mat-list-item>
        <mat-grid-list cols="7">
          <mat-grid-tile colspan="3">
            Role Name
          </mat-grid-tile>
          <mat-grid-tile colspan="3">
            Department
          </mat-grid-tile>
          <mat-grid-tile colspan="1">
          </mat-grid-tile>
        </mat-grid-list>
      </mat-list-item>

      <mat-list-item *ngFor="let role of sortedRoles">
        <mat-grid-list cols="7">
          <mat-grid-tile colspan="3">
            {{ role.roleName }}
          </mat-grid-tile>
          <mat-grid-tile colspan="3">
            {{ getDepartmentName(role.departmentId) }}
          </mat-grid-tile>
          <mat-grid-tile colspan="1">
            <button matButton [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="onOpenEditDialog(role.roleId)">Edit</button>
              <button mat-menu-item (click)="onDelete(role.roleId)">Delete</button>
            </mat-menu>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-list-item>
    </mat-list>
  </mat-card-content>
</mat-card>
