@if(!isLoading) {

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Add New Employee
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">

        <div class="flex-container">
          <div class="flex-item">
            <app-input
              label="Employee Name"
              (valueChanged)="handleEmployeeChange($event)">
            </app-input>
          </div>
          <div class="flex-item">
            <app-input-salary
              (valueChanged)="handleSalaryChange($event)">
            </app-input-salary>
          </div>
          <div class="flex-item">
            <app-select-department
              (departmentChanged)="handleDepartmentChange($event)">
            </app-select-department>
          </div>
          <div class="flex-item" *ngIf="employeeForm.controls['departmentId']!.value != -1">
            <app-select-role
              [departmentId]="employeeForm.controls['departmentId'].value"
              (roleChanged)="handleRoleChange($event)">
            </app-select-role>
          </div>
        </div>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="onSubmit()">Add Employee</button>
    </mat-card-actions>
  </mat-card>

} @else {
  <mat-spinner></mat-spinner>
}
