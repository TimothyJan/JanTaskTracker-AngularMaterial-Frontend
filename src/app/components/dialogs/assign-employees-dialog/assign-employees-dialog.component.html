@if(!isLoading) {
  <h1 mat-dialog-title>Assign Employees to: {{ projectTask.title }}</h1>

  <div mat-dialog-content>
    <form>
      <mat-selection-list
        multiple
        [(ngModel)]="selectedEmployees"
        name="employees">
        <mat-list-option
          *ngFor="let employee of employeeList"
          [value]="employee.employeeId">
          {{ employee.name }} (ID: {{ employee.employeeId }})
        </mat-list-option>
      </mat-selection-list>
    </form>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="saveAssignments()">Save</button>
  </div>
} @else {
  <mat-spinner></mat-spinner>
}
