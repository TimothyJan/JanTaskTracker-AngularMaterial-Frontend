<mat-label>{{label}}: </mat-label>
<mat-form-field>
  <mat-label>Choose a date</mat-label>
  <input matInput [matDatepicker]="picker" [value]="initialDate">
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker
    #picker
    (closed)="onDateChange(picker.startAt || null)">
  </mat-datepicker>
</mat-form-field>
